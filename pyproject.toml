[project]
name = "fastapi-study"
version = "0.1.0"
description = "Commercial-style FastAPI RAG study project bootstrapped with uv."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "sqlalchemy>=2.0.41",
    "alembic>=1.16.4",
    "chromadb>=1.0.15",
    "sentence-transformers>=5.0.0",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.1.1",
    "langchain>=0.3.26",
    "langchain-chroma>=0.2.4",
    "langchain-ollama>=0.3.3",
    "langchain-text-splitters>=0.3.8",
    "langchain-core>=0.3.69",
    "pydantic-settings>=2.10.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "ruff>=0.12.2",
    "ipython>=9.4.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "common", "config", "core", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
