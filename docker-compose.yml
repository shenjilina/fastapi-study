services:
  # FastAPI 应用服务
  fastapi-app:
    build: .
    container_name: fastapi-app
    ports:
      - "8000:8000"
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - APP_DEBUG=false
      - APP_ENV=production
      - DATABASE_URL=sqlite:///./data/rag_project.db
      - CHROMA_PERSIST_DIRECTORY=./chroma
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen2.5:7b
      - LOG_LEVEL=INFO
      - LOG_FILE=logs/app.log
    volumes:
      - app-data:/app/data
      - app-chroma:/app/chroma
      - app-logs:/app/logs
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ChromaDB 向量数据库服务（独立实例，供 chroma-admin 查看）
  chroma:
    image: chromadb/chroma:latest
    container_name: chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  # ChromaDB 可视化管理工具
  chroma-admin:
    image: neetpalsingh/chromadb-admin:latest
    container_name: chroma-admin
    ports:
      - "3434:3434"
    environment:
      CHROMADB_URL: http://chroma:8000
    depends_on:
      chroma:
        condition: service_started
    restart: unless-stopped

volumes:
  app-data:
  app-chroma:
  app-logs:
  chroma-data:
